<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>🌌 Космічне Казино</title>
<link rel="stylesheet" href="./stule.css">
</head>
<body>

<canvas id="particles"></canvas>

<h1>🎰 Космічне Казино</h1>
<audio id="bgMusic" src="./mp3/work_chilla_Muzyka_dlya_raboty_i_fona_-_Spokojnaya_muzyka_dlya_fonovogo_proslushivaniya_na_rabote_(SkySound.cc).mp3" loop ></audio>

<div class="top">
    <div>💰 Баланс: <span id="balance">500</span></div>
    <div>⚡ Рівень: <span id="level">1</span></div>
</div>

<div class="buttons">
    <button id="menuBtn">🎮 Меню ігор</button>
    <button id="statsBtn">📊 Статистика</button>
    <button id="upgradeBtn">⬆ Прокачка</button>
</div>

<!-- Меню -->
<div id="menu" class="panel">
    <h2>🎮 Виберіть гру</h2>
    <button id="rouletteGameBtn">🎡 Колесо Фортуни</button>
    <button id="slotGameBtn">🎰 Слот 777</button>
    <button id="diceGameBtn">🎲 Dice x2</button>
    <button id="boxesGameBtn">📦 Три коробки</button>
    <button id="bossGameBtn">👑 Бос</button>
    <button id="coinFlipGameBtn">🪙 Монетка</button>
    <button id="questsGameBtn">📝 Квести</button>
</div>

<!-- Колесо Фортуни -->
<div id="wheelPanel" class="gamePanel panel">
    <h2>🎡 Колесо Фортуни</h2>
    <p>Ставка: <input type="number" id="wheelBet" value="10" min="1"></p>
    <button id="spinWheelBtn">🎯 Крутити колесо</button>
    <div id="wheelContainer">
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
        <div id="wheelPointer">▼</div>
    </div>
    <p id="wheelMessage"></p>
</div>

<!-- Coin Flip -->
<div id="coinFlipPanel" class="panel">
    <h2>🪙 Монетка</h2>
    <p>Ставка: <input type="number" id="coinBet" value="10" min="1"></p>
    <button id="headsBtn">Орёл 🦅</button>
    <button id="tailsBtn">Решка 🐍</button>
    <div id="coinContainer">
        <div id="coin"></div>
    </div>
    <p id="coinMessage"></p>
</div>

<!-- Квести -->
<div id="questsPanel" class="panel">
    <h2>📝 Квести</h2>
    <p id="questText">Натисни кнопку "Нове питання" щоб отримати квест</p>
    <div id="questOptions"></div>
    <button id="newQuestBtn">🎲 Нове питання</button>
    <p id="questMessage"></p>
</div>

<!-- Статистика -->
<div id="stats" class="panel">
    <h2>📊 Статистика</h2>
    <p>Ігор: <span id="sGames">0</span></p>
    <p>Виграш: <span id="sWins">0</span></p>
    <p>Програш: <span id="sLoss">0</span></p>
</div>

<audio id="clickSound" src="./mp3/button-124476.mp3"></audio>
<audio id="winSound" src="./mp3/video-game-bonus-323603.mp3"></audio>
<audio id="loseSound" src="./mp3/falling-stone-326058.mp3"></audio>

<script src="./index.js"></script>
</body>
</html>
